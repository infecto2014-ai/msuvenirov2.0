name: Deploy on push to main

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Runs only in the production repo, or where the repository variable DEPLOY_ENABLED=true is set
    # (Settings → Secrets and variables → Actions → Variables), so copies of the repo never touch the server.
    if: github.repository == 'infecto2014-ai/neon-souvenir-studio' || vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            # Pinned host keys (recommended): protects against MITM
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Backward-compatible fallback: trust-on-first-use
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      # The new Astro build needs Node >= 18.20.8 ON THE SERVER (check: node -v).
      - name: Run deploy commands on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            cd /var/www/msuvenirov.ru

            git fetch origin main
            git reset --hard origin/main

            npm ci --no-audit --no-fund
            npm run build

            # site chat (server/chat): restart only if it is installed (docs/DEPLOY.md, section 11)
            systemctl try-restart msuvenirov-chat 2>/dev/null || true
          EOF
