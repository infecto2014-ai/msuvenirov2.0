# Security headers for msuvenirov.ru
# Install to /etc/nginx/snippets/msuvenirov-security-headers.conf
#
# IMPORTANT: nginx drops ALL inherited add_header directives in any location
# that declares its own add_header. Therefore this file is included in the
# server{} block AND in every location{} that has its own add_header.
# `always` makes the headers appear on 4xx/5xx responses (404 page) as well.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# Content-Security-Policy in REPORT-ONLY mode: violations are logged to the
# browser console, nothing is blocked. After checking the console on all pages,
# rename the header to `Content-Security-Policy` (see docs/DEPLOY.md).
# Must stay on ONE line (a line break would end up inside the header value).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://mc.yandex.com https://yastatic.net https://code.jivosite.com https://*.jivosite.com https://code.jivo.ru https://*.jivo.ru; connect-src 'self' https://iqcolrciqeokfsnweoej.supabase.co https://mc.yandex.ru https://mc.yandex.com wss://mc.yandex.ru wss://mc.yandex.com https://*.jivosite.com wss://*.jivosite.com https://*.jivo.ru wss://*.jivo.ru; img-src 'self' data: blob: https://mc.yandex.ru https://mc.yandex.com https://*.yandex.ru https://*.jivosite.com https://*.jivo.ru; frame-src https://yandex.ru https://*.yandex.ru https://mc.yandex.ru https://mc.yandex.com https://rutube.ru https://*.jivosite.com https://*.jivo.ru; style-src 'self' 'unsafe-inline' https://*.jivosite.com https://*.jivo.ru; font-src 'self' data: https://*.jivosite.com https://*.jivo.ru; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
