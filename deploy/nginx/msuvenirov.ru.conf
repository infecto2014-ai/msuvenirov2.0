# nginx config for msuvenirov.ru (copy to /etc/nginx/sites-enabled/msuvenirov.ru).
# Static Astro build: /var/www/msuvenirov.ru/dist
#   - pages are emitted as flat files: /price.html, /pechat-na-futbolkah.html ...
#   - hashed assets live in /_astro/ (immutable, 1 year)
#   - 404 page: dist/404.html
# Requires the snippet deploy/nginx/snippets/msuvenirov-security-headers.conf
#   -> /etc/nginx/snippets/msuvenirov-security-headers.conf
# Install/rollback steps: docs/nginx-seo.md and docs/DEPLOY.md
#
# ---------------------------------------------------------------------------
# OPTIONAL rate limiting. `limit_req_zone` is only valid in http{} context, so
# it must NOT be placed inside a server{} block. Put it into a separate file
# included from http{}, e.g. /etc/nginx/conf.d/msuvenirov-ratelimit.conf:
#
#   limit_req_zone $binary_remote_addr zone=msuvenirov_pages:10m rate=20r/s;
#
# and then, inside the `location /` block below, uncomment:
#
#   limit_req zone=msuvenirov_pages burst=40 nodelay;
#   limit_req_status 429;
#
# Check with `nginx -t` before reloading.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name msuvenirov.ru www.msuvenirov.ru;

    server_tokens off;

    return 301 https://msuvenirov.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.msuvenirov.ru;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/msuvenirov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/msuvenirov.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/msuvenirov-security-headers.conf;

    return 301 https://msuvenirov.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name msuvenirov.ru;

    root /var/www/msuvenirov.ru/dist;
    index index.html;

    server_tokens off;
    charset utf-8;

    access_log /var/log/nginx/msuvenirov.access.log;
    error_log /var/log/nginx/msuvenirov.error.log;

    ssl_certificate /etc/letsencrypt/live/msuvenirov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/msuvenirov.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (also repeated in every location with its own add_header).
    include snippets/msuvenirov-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               text/javascript application/xml image/svg+xml application/manifest+json;

    # Canonical URLs (301). $request_uri is the original request, so internal
    # try_files jumps (/price -> /price.html) never trigger these rules.
    # /index.html -> /   (must come before the *.html rule)
    if ($request_uri ~* "^/index\.html(\?.*)?$") {
        return 301 /;
    }
    # /price.html -> /price   (Yandex verification file yandex_*.html is left alone)
    if ($request_uri ~* "^/(?!yandex_)([^?]+)\.html(\?.*)?$") {
        return 301 /$1;
    }
    # /price/ -> /price   ("/" itself never matches)
    rewrite ^/(.+)/$ /$1 permanent;

    # Old URLs of the previous site -> new pages (exact match)
    location = /pechat_na_tkani {
        return 301 /pechat-na-futbolkah;
    }
    location = /mug-print {
        return 301 /pechat-na-kruzhkah;
    }

    # Unknown URLs: real HTTP 404 with the prerendered 404 page (dist/404.html)
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include snippets/msuvenirov-security-headers.conf;
    }
    location = /404 {
        return 404;
    }

    # Let's Encrypt HTTP-01 challenge must stay reachable (before the dotfile deny)
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
    }

    # Home page: prerendered dist/index.html
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        include snippets/msuvenirov-security-headers.conf;
    }

    # Hashed build assets: content-addressed, safe to cache for a year
    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/msuvenirov-security-headers.conf;
        access_log off;
    }

    # Fonts (stable file names, but effectively never change)
    location ^~ /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/msuvenirov-security-headers.conf;
        access_log off;
    }

    # Images that can be replaced under the same name: 7 days, no `immutable`
    location ^~ /img/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        include snippets/msuvenirov-security-headers.conf;
        access_log off;
    }
    location ^~ /portfolio/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        include snippets/msuvenirov-security-headers.conf;
        access_log off;
    }
    location ^~ /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        include snippets/msuvenirov-security-headers.conf;
        access_log off;
    }

    # Favicons and og-image (favicon.ico, favicon.svg, favicon-192.png, og-image.jpg ...)
    location ~* ^/(favicon[^/]*\.(ico|svg|png)|og-image[^/]*\.(png|jpe?g|webp))$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        include snippets/msuvenirov-security-headers.conf;
        access_log off;
    }

    # Site chat and «Перезвоните мне» (server/chat, systemd unit msuvenirov-chat) — see docs/DEPLOY.md, section 11.
    # Long polling keeps a request open up to 25 s, hence the longer read timeout.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 40s;
        proxy_buffering off;
        client_max_body_size 32k;
        add_header Cache-Control "no-store";
        include snippets/msuvenirov-security-headers.conf;
    }

    # Pages: /price -> price.html, /faq -> faq.html, /pechat-na-futbolkah -> pechat-na-futbolkah.html ...
    # Everything else (robots.txt, sitemap, sw.js, site.webmanifest) is revalidated too.
    location / {
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache";
        include snippets/msuvenirov-security-headers.conf;
        # limit_req zone=msuvenirov_pages burst=40 nodelay;   # see the note at the top
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
